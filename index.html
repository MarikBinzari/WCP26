  <body>
    <div id="root"></div>
    <script>
      (function() {
        var confirmed = false;
        var HTML = '<div style="font-size:64px">📡</div><div style="font-size:22px;font-weight:800;color:#111;text-align:center">Fără conexiune la internet</div><div style="font-size:14px;color:#555;text-align:center;max-width:260px;line-height:1.5">Verifică WiFi-ul sau datele mobile.<br>Aplicația se va reîncărca automat.</div>';
        function show() {
          if (document.getElementById('__ol')) return;
          var d = document.createElement('div');
          d.id = '__ol';
          d.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;z-index:2147483647;background:#ffffff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,sans-serif;';
          d.innerHTML = HTML;
          document.body.appendChild(d);
          window.addEventListener('online', function() { window.location.reload(); });
        }
        function tryPing() {
          var xhr = new XMLHttpRequest();
          xhr.timeout = 2500;
          xhr.onload = function() { confirmed = true; };
          xhr.onerror = show;
          xhr.ontimeout = show;
          xhr.open('HEAD', '%VITE_SUPABASE_URL%/health?_=' + Date.now(), true);
          xhr.send();
        }
        if (!navigator.onLine) { show(); } else { tryPing(); }
        setTimeout(function() { if (!confirmed) show(); }, 4500);
      })();
    </script>
    <script>
      (function() {
        var V = '20260628-v5';
        if (localStorage.getItem('__pwa_v') !== V) {
          localStorage.setItem('__pwa_v', V);
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              var p = regs.map(function(r) { return r.unregister(); });
              return Promise.all(p);
            }).then(function() {
              return caches.keys();
            }).then(function(keys) {
              return Promise.all(keys.map(function(k) { return caches.delete(k); }));
            }).then(function() {
              window.location.reload(true);
            });
          }
        }
      })();
    </script>
